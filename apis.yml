name: Roon
description: 'Roon is a digital health platform (operating as CareSpace Health Inc.) that helps
  people navigate serious and critical health conditions by connecting them with trusted answers from
  leading medical experts. Rather than relying on "Dr. Google" or legacy content sites, Roon publishes
  thousands of short, doctor-created video answers covering conditions such as ALS, glioblastoma (GBM),
  dementia, PCOS, fertility, and women''s health, organized so patients and caregivers can quickly find
  vetted guidance for their journey. Founded in 2021 by Vikram Bhaskaran, Arun Ranganathan, and Dr. Rohan
  Ramakrishna, Roon delivers its experience primarily through consumer iOS apps and its website, and raised
  a $15M Series A co-led by Forerunner Ventures and FirstMark. Roon is a consumer-facing health information
  product and does not currently publish a public developer API surface.'
